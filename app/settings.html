<script type="module">
  import Auth from '../js/clerk.js?v=3';

  async function init() {
    // Instant Cookie-based Auth Guard
    const getCookie = (name) => {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
    };
    if (getCookie('tf_authenticated') !== 'true' && window.location.hostname !== 'localhost') {
      window.location.href = '/login';
      return;
    }

    let user;
    try {
      user = await Auth.init();
      if (!user && window.location.hostname !== 'localhost') {
        window.location.href = '/login';
        return;
      }
    } catch (err) {
      console.error("TF Auth: Failed to initialize Auth in settings:", err);
      if (window.location.hostname !== 'localhost') {
        window.location.href = '/login';
        return;
      }
    }

    const clerk = Auth.getInstance();
    const profileDiv = document.getElementById('clerk-user-profile');
    if (clerk && profileDiv) {
      clerk.mountUserProfile(profileDiv, {
        appearance: {
          variables: {
            colorPrimary: '#3b5c8f', // var(--brand)
            colorBackground: '#121215', // var(--bg-surface)
            colorText: '#f4f4f5', // var(--text-1)
            colorTextSecondary: '#a1a1aa', // var(--text-2)
            colorInputBackground: '#1c1c21', // var(--bg-elevated)
            colorInputText: '#f4f4f5',
            borderRadius: '4px',
          },
          elements: {
            card: {
              backgroundColor: 'transparent',
              boxShadow: 'none',
              width: '100%',
              maxWidth: '800px',
            }
          }
        }
      });
    }
  }

  init().catch(err => {
    console.error("TF Settings Error:", err);
    const errMsg = err?.message || '';
    const isNetworkError = errMsg.includes('Network Error') || errMsg.includes('timeout') || errMsg.includes('HTTP 5') || errMsg.includes('Failed to fetch');
    if (!isNetworkError && typeof Auth !== 'undefined' && Auth.triggerEmergencyLogout) {
      Auth.triggerEmergencyLogout("Failed to initialize settings page.");
    } else {
      if (window.location.hostname !== 'localhost') {
        window.location.replace("/");
      }
    }
  });
</script>
