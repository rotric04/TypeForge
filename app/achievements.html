<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Achievements | TypeForge AI</title>
  <meta name="description" content="Track your typing milestones, unlock badges, and level up your skills."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="preconnect" href="https://esm.sh" crossorigin/>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/animations.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <link rel="stylesheet" href="../css/app-pages.css"/>
  <link rel="stylesheet" href="../css/achievements.css"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⌨️</text></svg>"/>
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    body { background-color: var(--bg-base); }
    .app-layout { display: flex; min-height: 100dvh; padding-top: 12px; }
    .app-main { flex: 1; margin-left: 68px; padding: 32px; max-width: 1400px; }
    
    .page-title-wrap { margin-bottom: 32px; }
    .page-title { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
    .page-subtitle { color: var(--text-3); font-size: 15px; }

    #ach-toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(13, 13, 26, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-brand);
      border-radius: 16px; padding: 14px 24px; display: flex; gap: 16px; align-items: center;
      z-index: 9999; transition: transform 0.5s var(--ease-spring); box-shadow: 0 16px 40px rgba(0,0,0,0.5), 0 0 20px var(--brand-glow);
    }
    #ach-toast.show { transform: translateX(-50%) translateY(0); }

    .toast-icon { font-size: 32px; }
    .toast-body { display: flex; flex-direction: column; }
    .toast-title { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 2px; }
    .toast-msg { font-size: 13px; color: var(--text-2); }

    @media (max-width: 900px) {
      .app-main { margin-left: 0; padding: 24px 16px 100px; }
    }
  </style>
</head>
<body class="tf-authenticated">

<div class="app-layout">
  <!-- Sidebar -->
  <aside class="app-sidebar" role="navigation" aria-label="App navigation">
    <a href="/" class="sidebar-logo" aria-label="TypeForge AI Home">⌨️</a>
    <nav class="sidebar-nav">
      <div class="sidebar-item" onclick="location.href='typing.html'" title="Train" aria-label="Train">
        <span class="sidebar-icon">⌨️</span><span class="sidebar-label">Train</span>
      </div>
      <div class="sidebar-item" onclick="location.href='dashboard.html'" title="Dashboard" aria-label="Dashboard">
        <span class="sidebar-icon">📊</span><span class="sidebar-label">Dashboard</span>
      </div>
      <div class="sidebar-item active" onclick="location.href='achievements.html'" title="Achievements" aria-label="Achievements">
        <span class="sidebar-icon">🏆</span><span class="sidebar-label">Achievements</span>
      </div>
      <div class="sidebar-item" onclick="location.href='history.html'" title="History" aria-label="History">
        <span class="sidebar-icon">📜</span><span class="sidebar-label">History</span>
      </div>
    </nav>
    <div class="sidebar-bottom">
      <div class="sidebar-item" onclick="location.href='settings.html'" title="Settings" aria-label="Settings">
        <span class="sidebar-icon">⚙️</span><span class="sidebar-label">Settings</span>
      </div>
      <div class="sidebar-item" title="Profile" aria-label="Profile" id="sidebar-profile">
        <span class="sidebar-icon" id="nav-avatar">U</span>
        <span class="sidebar-label" data-auth-name>Profile</span>
      </div>
      <div class="sidebar-item" title="Sign Out" aria-label="Sign Out" data-auth-signout>
        <span class="sidebar-icon">🚪</span><span class="sidebar-label">Sign Out</span>
      </div>
    </div>
  </aside>

  <main class="app-main">
    <div class="page-title-wrap">
      <h1 class="page-title">Achievements</h1>
      <p class="page-subtitle">Track your milestones, unlock rare badges, and build your typing legacy.</p>
    </div>

    <!-- Bento Hero -->
    <div class="ach-hero-bento">
      
      <!-- Primary Profile Bento -->
      <div class="bento-card">
        <div class="bento-main">
          <div class="bento-avatar" id="xp-avatar">U</div>
          <div class="bento-info">
            <div class="bento-title" id="xp-name">Typist</div>
            <div class="bento-subtitle">Level <strong id="xp-level-num">1</strong></div>
          </div>
        </div>
        <div class="xp-progress-wrap">
          <div class="xp-track"><div class="xp-fill" id="xp-bar-fill" style="width:0%"></div></div>
          <div class="xp-labels"><span id="xp-current">0 XP</span><span id="xp-next">500 XP to next level</span></div>
        </div>
      </div>

      <!-- Stats Bento 1 -->
      <div class="bento-card" style="align-items:center; text-align:center; justify-content:center;">
        <div class="bento-stat-val" id="chip-unlocked">0</div>
        <div class="bento-stat-lbl">Badges Unlocked</div>
      </div>

      <!-- Stats Bento 2 -->
      <div class="bento-card" style="align-items:center; text-align:center; justify-content:center;">
        <div class="bento-stat-val" id="chip-sessions">0</div>
        <div class="bento-stat-lbl">Total Sessions</div>
      </div>

    </div>

    <!-- Category Filters -->
    <div class="ach-filters" id="filter-tabs">
      <button class="ach-filter-btn active" data-category="all">All Badges</button>
      <button class="ach-filter-btn" data-category="speed">⚡ Speed</button>
      <button class="ach-filter-btn" data-category="accuracy">🎯 Accuracy</button>
      <button class="ach-filter-btn" data-category="streak">📅 Consistency</button>
      <button class="ach-filter-btn" data-category="milestone">🚀 Milestones</button>
    </div>

    <!-- Achievements Grid -->
    <div class="achievements-grid" id="achievements-grid">
      <!-- Cards dynamically inserted here -->
    </div>
  </main>
</div>

<!-- Unlock Toast -->
<div id="ach-toast">
  <div class="toast-icon" id="toast-icon">🏆</div>
  <div class="toast-body">
    <div class="toast-title" id="toast-title">Achievement Unlocked!</div>
    <div class="toast-msg" id="toast-msg">You earned a new badge.</div>
  </div>
</div>

<script type="module">
  import Auth from '../js/clerk.js?v=2';
  import API from '../js/api.js';
  import { displayName, personalizeBadge, xpToNextLevel } from '../js/app-data.js';

  const ALL_ACHIEVEMENTS = [
    { id:"first_session", name:"Launched",  icon:"🚀", desc:"Complete your very first session",  category:"milestone", rarity:"common",    goal:1,  metric:"sessions" },
    { id:"sessions_5",  name:"Finding Rhythm", icon:"🎵", desc:"Complete 5 sessions", category:"streak", rarity:"common", goal:5, metric:"sessions" },
    { id:"sessions_10",  name:"Getting Started",  icon:"🌱", desc:"Complete 10 sessions",   category:"streak", rarity:"common",    goal:10,  metric:"sessions" },
    { id:"sessions_50",  name:"Dedicated",        icon:"📅", desc:"Complete 50 sessions",   category:"streak", rarity:"rare",      goal:50,  metric:"sessions" },
    { id:"sessions_100", name:"Century Typist",   icon:"💯", desc:"Complete 100 sessions",  category:"streak", rarity:"epic",      goal:100, metric:"sessions" },
    { id:"sessions_500", name:"Legendary Typist", icon:"👑", desc:"Complete 500 sessions",  category:"streak", rarity:"legendary", goal:500, metric:"sessions" },
    
    { id:"wpm_40",  name:"Warming Up",      icon:"☕", desc:"Reach 40 WPM in a session",  category:"speed",    rarity:"common",    goal:40,  metric:"wpm" },
    { id:"wpm_50",  name:"Half Century",    icon:"🔥", desc:"Reach 50 WPM in a session",  category:"speed",    rarity:"common",    goal:50,  metric:"wpm" },
    { id:"wpm_80",  name:"Fast Fingers",    icon:"⚡", desc:"Reach 80 WPM in a session",  category:"speed",    rarity:"common",    goal:80,  metric:"wpm" },
    { id:"wpm_100", name:"Century Club",    icon:"💯", desc:"Reach 100 WPM in a session", category:"speed",    rarity:"rare",      goal:100, metric:"wpm" },
    { id:"wpm_120", name:"Speed Demon",     icon:"🏎️", desc:"Reach 120 WPM in a session", category:"speed",    rarity:"epic",      goal:120, metric:"wpm" },
    { id:"wpm_150", name:"Ghost Fingers",   icon:"👻", desc:"Reach 150 WPM in a session", category:"speed",    rarity:"legendary", goal:150, metric:"wpm" },
    
    { id:"acc_95",  name:"Sharp Eyes",      icon:"👁️", desc:"95%+ accuracy in a session", category:"accuracy", rarity:"common",    goal:95,  metric:"accuracy" },
    { id:"acc_99",  name:"Perfect Aim",     icon:"🎯", desc:"99%+ accuracy in a session", category:"accuracy", rarity:"rare",      goal:99,  metric:"accuracy" },
    { id:"acc_100", name:"Flawless",        icon:"💎", desc:"100% accuracy — no errors",  category:"accuracy", rarity:"epic",      goal:100, metric:"accuracy" },
    
    { id:"xp_500",  name:"XP Surge", icon:"🌟", desc:"Earn 500 total XP", category:"milestone", rarity:"common", goal:500, metric:"xp" },
    { id:"level_5", name:"Rising Star", icon:"⭐", desc:"Reach level 5", category:"milestone", rarity:"rare", goal:5, metric:"level" },
    { id:"no_errors",name:"Zero Error",     icon:"🧊", desc:"Complete a session with 0 errors",   category:"accuracy",  rarity:"rare",    goal:0,   metric:"errors" },
  ];

  let achievementsData = [];
  let userProfile = {};
  let sessionHistory = [];
  let userDisplayName = 'Typist';

  async function init() {
    // Instant Cookie-based Auth Guard
    const getCookie = (name) => {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
    };
    if (getCookie('tf_authenticated') !== 'true' && window.location.hostname !== 'localhost') {
      window.location.href = '/login';
      return;
    }

    const user = await Auth.init();
    if (!user && window.location.hostname !== 'localhost') {
      window.location.href = '/login';
      return;
    }

    if (user) {
      userDisplayName = displayName(user, null);
      document.querySelectorAll('[data-auth-name]').forEach(el => el.textContent = userDisplayName);
      document.getElementById('xp-name').textContent = userDisplayName;
      document.getElementById('xp-avatar').textContent = userDisplayName[0].toUpperCase();
    }

    try {
      const [profileRes, historyRes, achRes] = await Promise.allSettled([
        API.getUserProfile(),
        API.getHistory(100, 0),
        API.getAchievements()
      ]);

      userProfile = profileRes.value || {
        xp: 0,
        level: 1,
        total_sessions: 0,
        best_wpm: 0
      };
      
      sessionHistory = historyRes.value || JSON.parse(localStorage.getItem('tf_session_history') || '[]');
      const unlockedIds = achRes.value ? achRes.value.filter(a => a.is_unlocked).map(a => a.id) : [];

      const computed = computeProgress(sessionHistory, userProfile);
      achievementsData = ALL_ACHIEVEMENTS.map(ach => ({
        ...ach,
        is_unlocked: unlockedIds.includes(ach.id) || computed.unlocked.includes(ach.id),
        progress: computed.progress[ach.id] ?? 0,
      }));

      userDisplayName = displayName(user, userProfile);
      renderHero(userProfile, sessionHistory);
      renderGrid('all');
      setupFilters();

    } catch (err) {
      console.error('Failed to load achievements:', err);
      achievementsData = ALL_ACHIEVEMENTS.map(ach => ({ ...ach, is_unlocked: false, progress: 0 }));
      renderGrid('all');
      setupFilters();
    }
  }

  function computeProgress(history, profile) {
    const unlocked = [];
    const progress = {};
    const totalSessions = profile.total_sessions || history.length;
    const totalXp = profile.xp || 0;
    const userLevel = profile.level || 1;
    const bestWpm = profile.best_wpm || Math.max(0, ...history.map(s => s.wpm || 0));

    ALL_ACHIEVEMENTS.forEach(ach => {
      let pct = 0;
      switch (ach.metric) {
        case 'wpm': pct = Math.min(100, Math.round((bestWpm / ach.goal) * 100)); if (bestWpm >= ach.goal) unlocked.push(ach.id); break;
        case 'accuracy': {
          const bestAcc = Math.max(0, ...history.map(s => s.accuracy || 0));
          pct = Math.min(100, Math.round((bestAcc / ach.goal) * 100)); if (bestAcc >= ach.goal) unlocked.push(ach.id); break;
        }
        case 'sessions': pct = Math.min(100, Math.round((totalSessions / ach.goal) * 100)); if (totalSessions >= ach.goal) unlocked.push(ach.id); break;
        case 'errors': {
          const hadZeroErrors = history.some(s => (s.errors || 0) === 0);
          pct = hadZeroErrors ? 100 : 0; if (hadZeroErrors) unlocked.push(ach.id); break;
        }
        case 'xp': pct = Math.min(100, Math.round((totalXp / ach.goal) * 100)); if (totalXp >= ach.goal) unlocked.push(ach.id); break;
        case 'level': pct = Math.min(100, Math.round((userLevel / ach.goal) * 100)); if (userLevel >= ach.goal) unlocked.push(ach.id); break;
      }
      progress[ach.id] = pct;
    });
    return { unlocked, progress };
  }

  function renderHero(profile, history) {
    const xp = profile.xp || 0;
    const level = profile.level || 1;
    const { cap, inLevel, pct } = xpToNextLevel(level, xp);

    document.getElementById('xp-level-num').textContent = level;
    document.getElementById('xp-current').textContent = `${inLevel.toLocaleString()} XP`;
    document.getElementById('xp-next').textContent = `${cap} XP to Level ${level + 1}`;
    
    setTimeout(() => {
      document.getElementById('xp-bar-fill').style.width = pct + '%';
    }, 200);

    const unlockedCount = achievementsData.filter(a => a.is_unlocked).length;
    const sessionCount = profile.total_sessions || history.length;

    // Counter animation
    animateVal(document.getElementById('chip-unlocked'), 0, unlockedCount, 1000);
    animateVal(document.getElementById('chip-sessions'), 0, sessionCount, 1000);
  }

  function animateVal(obj, start, end, duration) {
    let startTimestamp = null;
    const step = (timestamp) => {
      if (!startTimestamp) startTimestamp = timestamp;
      const progress = Math.min((timestamp - startTimestamp) / duration, 1);
      obj.innerHTML = Math.floor(progress * (end - start) + start);
      if (progress < 1) window.requestAnimationFrame(step);
    };
    window.requestAnimationFrame(step);
  }

  function renderGrid(category) {
    const grid = document.getElementById('achievements-grid');
    grid.innerHTML = '';

    const list = category === 'all' ? achievementsData : achievementsData.filter(a => a.category === category);
    
    const rarityOrder = { legendary: 0, epic: 1, rare: 2, common: 3 };
    const sorted = [...list].sort((a, b) => {
      if (a.is_unlocked !== b.is_unlocked) return a.is_unlocked ? -1 : 1;
      return (rarityOrder[a.rarity] ?? 3) - (rarityOrder[b.rarity] ?? 3);
    });

    sorted.forEach((ach, idx) => {
      const show = personalizeBadge(ach, userDisplayName);
      const isUnl = ach.is_unlocked;
      const prog = isUnl ? 100 : ach.progress;
      
      const card = document.createElement('div');
      card.className = `ach-card rarity-${ach.rarity} ${isUnl ? 'unlocked' : 'locked'} tf-reveal`;
      card.style.animationDelay = `${idx * 0.05}s`;

      card.innerHTML = `
        <div class="ach-header">
          <div class="ach-icon-container">${ach.icon}</div>
          <div class="ach-meta">
            <div class="ach-title">${show.name}</div>
            <div class="ach-desc">${show.desc}</div>
            <div class="ach-badge-tag">${ach.rarity}</div>
          </div>
        </div>
        ${isUnl 
          ? `<div class="ach-unlocked-stamp">✓ Unlocked</div>`
          : `<div class="ach-prog-container">
               <div class="ach-prog-lbl"><span>Progress</span><span>${prog}%</span></div>
               <div class="ach-prog-track"><div class="ach-prog-fill" style="width:${prog}%"></div></div>
             </div>`
        }
      `;
      grid.appendChild(card);
    });
  }

  function setupFilters() {
    document.querySelectorAll('.ach-filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.ach-filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGrid(btn.dataset.category);
      });
    });
  }

  init();
</script>
</body>
</html>
