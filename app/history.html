  <style>
    body {
      background-color: var(--bg-base);
    }
    .app-layout { display: flex; min-height: 100vh; padding-top: 20px; }
    .app-main {
      flex: 1;
      margin-left: 68px;
      padding: 40px 32px;
      max-width: 1300px;
    }

    /* ── Header ── */
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 20px;
    }
    .page-title { font-size: 28px; font-weight: 800; margin-bottom: 6px; }
    .page-subtitle { color: var(--text-3); font-size: 14px; }

    /* ── Summary Stats Bar ── */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }
    .stat-chip {
      background: var(--bg-surface);
      border: 1px solid var(--border-1);
      border-radius: var(--r-md);
      padding: 16px 20px;
      text-align: center;
      transition: border-color 0.2s;
    }
    .stat-chip:hover { border-color: var(--border-brand); }
    .stat-chip-value {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 800;
      color: var(--text-1);
    }
    .stat-chip-label { font-size: 11px; color: var(--text-4); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }

    /* ── Filter Bar ── */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-pill {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: var(--r-sm);
      border: 1px solid var(--border-1);
      background: var(--bg-surface);
      color: var(--text-3);
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-pill:hover { color: var(--text-1); border-color: var(--border-2); }
    .filter-pill.active {
      background: var(--bg-elevated);
      border-color: var(--brand-light);
      color: var(--text-1);
    }
    .filter-spacer { flex: 1; }
    .load-more-btn {
      display: block;
      margin: 32px auto 0;
      padding: 12px 32px;
      background: var(--bg-surface);
      border: 1px solid var(--border-2);
      border-radius: var(--r-sm);
      color: var(--text-2);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .load-more-btn:hover { border-color: var(--border-brand); color: var(--text-1); background: var(--bg-elevated); }

    /* ── Session Cards ── */
    .sessions-list { display: flex; flex-direction: column; gap: 12px; }
    .session-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-1);
      border-radius: var(--r-md);
      padding: 20px 24px;
      display: grid;
      grid-template-columns: 100px 1fr auto auto auto auto 120px;
      align-items: center;
      gap: 16px;
      transition: all 0.2s var(--ease-out);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .session-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--brand-light);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .session-card:hover { transform: translateX(4px); border-color: var(--border-brand); box-shadow: none; }
    .session-card:hover::before { opacity: 1; }

    .sess-date { font-size: 12px; color: var(--text-3); line-height: 1.5; }
    .sess-date strong { display: block; font-size: 13px; color: var(--text-2); font-weight: 600; }
    .sess-mode .mode-pill {
      padding: 4px 12px;
      border-radius: var(--r-sm);
      font-size: 11px;
      font-weight: 700;
      text-transform: capitalize;
      letter-spacing: 0.05em;
    }
    .mode-classic { background: rgba(99,102,241,0.15); color: var(--violet); }
    .mode-dev { background: rgba(16,185,129,0.15); color: var(--mint); }
    .mode-zen { background: rgba(245,158,11,0.15); color: var(--gold); }
    .mode-challenge { background: rgba(240,92,110,0.15); color: var(--error); }
    .mode-student { background: rgba(14,165,233,0.15); color: var(--sky); }
    .mode-focus { background: rgba(139,92,246,0.12); color: #a78bfa; }
    .mode-default { background: var(--bg-elevated); color: var(--text-3); }

    .sess-wpm {
      text-align: center;
    }
    .sess-wpm .val {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 800;
      color: var(--text-1);
    }
    .sess-wpm .lbl { font-size: 10px; color: var(--text-4); text-transform: uppercase; }

    .sess-acc { text-align: center; }
    .sess-acc .val { font-size: 16px; font-weight: 700; }
    .acc-perfect { color: var(--teal); }
    .acc-great { color: var(--gold); }
    .acc-ok { color: var(--text-2); }
    .acc-poor { color: var(--error); }

    .sess-cons { text-align: center; font-size: 14px; font-weight: 600; color: var(--text-2); }

    .sess-xp {
      text-align: right;
    }
    .sess-xp .xp-val {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 800;
      color: var(--gold);
    }
    .sess-xp .dur { font-size: 11px; color: var(--text-4); }

    .sess-spark { width: 120px; height: 36px; }

    /* ── Empty / Error States ── */
    .state-box {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-3);
    }
    .state-box .state-icon { font-size: 48px; margin-bottom: 16px; }
    .state-box .state-title { font-size: 20px; font-weight: 700; color: var(--text-1); margin-bottom: 8px; }
    .state-box .state-msg { font-size: 14px; line-height: 1.6; max-width: 360px; margin: 0 auto 24px; }
    .state-box a { color: var(--brand); font-weight: 600; text-decoration: none; }
    .state-box a:hover { text-decoration: underline; }

    /* ── Skeleton loader ── */
    .skeleton-card {
      height: 76px;
      background: var(--bg-surface);
      border: 1px solid var(--border-1);
      border-radius: var(--r-md);
      overflow: hidden;
      position: relative;
    }
    .skeleton-card::after {
      content: '';
      position: absolute;
      top: 0; left: -100%; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.04) 50%, transparent 100%);
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer { to { left: 100%; } }

    /* Responsive */
    @media (max-width: 768px) {
      .app-main { margin-left: 0; padding: 20px 16px calc(80px + env(safe-area-inset-bottom)); }
      .page-title { font-size: 22px; }
      .session-card {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto auto;
        gap: 12px;
        padding: 16px;
      }
      .sess-spark { display: none; }
      .sess-cons { display: none; }
    }
    @media (max-width: 480px) {
      .session-card {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .page-header { flex-direction: column; gap: 12px; }
    }
  </style>
</head>

<script type="module">
  import Auth from '../js/clerk.js?v=3';
  import API from '../js/api.js';
  import { loadProfileAndHistory, displayName } from '../js/app-data.js';
  import { initScrollReveal } from '../js/motion.js';

  const BATCH = 30;
  let offset = 0;
  let allSessions = [];
  let filteredSessions = [];
  let currentMode = 'all';

  async function init() {
    // Instant Cached UI Render (avoiding flash of "Typist" or Clerk ID)
    try {
      const cached = localStorage.getItem('tf_cached_profile');
      if (cached) {
        const cachedUser = JSON.parse(cached);
        const name = displayName(cachedUser, null);
        document.querySelectorAll('[data-auth-name]').forEach((el) => { el.textContent = name; });
        const avatar = document.getElementById('nav-avatar');
        if (avatar) {
          avatar.textContent = name.charAt(0).toUpperCase();
          if (cachedUser.avatarUrl) {
            avatar.innerHTML = `<img src="${cachedUser.avatarUrl}" alt="${name}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;"/>`;
          }
        }
      }
    } catch (e) {}

    // Instant Cookie-based Auth Guard
    const getCookie = (name) => {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
    };
    if (getCookie('tf_authenticated') !== 'true' && window.location.hostname !== 'localhost') {
      window.location.href = '/login';
      return;
    }

    let user;
    try {
      user = await Auth.init();
      if (!user && window.location.hostname !== 'localhost') {
        window.location.href = '/login';
        return;
      }
    } catch (err) {
      console.error("TF Auth: Failed to initialize Auth in history:", err);
      if (window.location.hostname !== 'localhost') {
        window.location.href = '/login';
        return;
      }
    }

    // Cache latest Clerk user details
    if (user) {
      localStorage.setItem('tf_cached_profile', JSON.stringify(user));
    }

    // Fetch profile and history in parallel
    const [profileRes, historyRes] = await Promise.allSettled([
      API.getUserProfile(),
      API.getHistory(60, 0)
    ]);

    const isProfileFailed = profileRes.status === 'rejected';
    const isHistoryFailed = historyRes.status === 'rejected';
    if ((isProfileFailed || isHistoryFailed) && window.location.hostname !== 'localhost') {
      const reasonMsg = (profileRes.reason?.message || historyRes.reason?.message || '');
      const isNetworkError = reasonMsg.includes('Network Error') || reasonMsg.includes('timeout') || reasonMsg.includes('HTTP 5') || reasonMsg.includes('Failed to fetch') || reasonMsg.includes('Database') || reasonMsg.includes('503') || reasonMsg.includes('500') || reasonMsg.includes('Internal Server Error');
      if (isNetworkError) {
        console.warn("TF: History/Profile requests failed due to network/timeout. Keeping user session.");
        const { showToast } = await import('../js/common.js');
        showToast({
          title: "Connection Issue",
          desc: "The servers are taking longer to respond. Showing cached data.",
          type: "warning",
          duration: 5000
        });
      }
    }

    const profile = profileRes.status === 'fulfilled' ? profileRes.value : {
      xp: 0,
      level: 1,
      total_sessions: 0,
      best_wpm: 0,
      weak_keys: [],
    };
    const data = historyRes.status === 'fulfilled' && historyRes.value ? historyRes.value : [];
    
    const name = displayName(user, profile);
    document.querySelectorAll('[data-auth-name]').forEach((el) => { el.textContent = name; });

    allSessions = data || [];
    offset = allSessions.length;

    renderSummaryStats(allSessions);
    applyFilter('all');

    document.getElementById('filter-bar').style.display = 'flex';
    document.getElementById('history-subtitle').textContent =
      allSessions.length === 0
        ? 'No sessions yet. Your first run takes one minute.'
        : `${allSessions.length} session${allSessions.length !== 1 ? 's' : ''} found`;

    if (allSessions.length >= BATCH) {
      document.getElementById('load-more-btn').style.display = 'block';
    }


    // Filter pills
    document.querySelectorAll('.filter-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentMode = pill.dataset.mode;
        applyFilter(currentMode);
      });
    });

    // Load more
    document.getElementById('load-more-btn').addEventListener('click', async () => {
      const btn = document.getElementById('load-more-btn');
      btn.textContent = 'Loading…';
      btn.disabled = true;
      try {
        const more = await API.getHistory(BATCH, offset);
        allSessions = [...allSessions, ...(more || [])];
        offset = allSessions.length;
        applyFilter(currentMode);
        if (more.length < BATCH) btn.style.display = 'none';
        else { btn.textContent = 'Load More Sessions'; btn.disabled = false; }
      } catch { btn.textContent = 'Load More Sessions'; btn.disabled = false; }
    });
  }

  function applyFilter(mode) {
    filteredSessions = mode === 'all'
      ? allSessions
      : allSessions.filter(s => s.mode === mode);
    renderSessions(filteredSessions);
  }

  function renderSummaryStats(list) {
    const el = document.getElementById('stats-bar');
    if (!list.length) { el.innerHTML = ''; return; }

    const totalSess = list.length;
    const avgWpm    = Math.round(list.reduce((s, r) => s + (r.wpm || 0), 0) / totalSess);
    const bestWpm   = Math.max(...list.map(r => r.wpm || 0));
    const avgAcc    = (list.reduce((s, r) => s + (typeof r.accuracy === 'number' ? r.accuracy : parseFloat(r.accuracy || 0)), 0) / totalSess).toFixed(1);
    const avgCons   = (list.reduce((s, r) => s + (typeof r.consistency === 'number' ? r.consistency : parseFloat(r.consistency || 0)), 0) / totalSess).toFixed(1);
    const totalXp   = list.reduce((s, r) => s + (r.xp_earned || 0), 0);
    const totalMins = Math.round(list.reduce((s, r) => s + (r.duration_secs || 0), 0) / 60);

    el.innerHTML = `
      <div class="stat-chip"><div class="stat-chip-value">${totalSess}</div><div class="stat-chip-label">Sessions</div></div>
      <div class="stat-chip"><div class="stat-chip-value">${bestWpm}</div><div class="stat-chip-label">Best WPM</div></div>
      <div class="stat-chip"><div class="stat-chip-value">${avgWpm}</div><div class="stat-chip-label">Avg WPM</div></div>
      <div class="stat-chip"><div class="stat-chip-value">${avgAcc}%</div><div class="stat-chip-label">Avg Accuracy</div></div>
      <div class="stat-chip"><div class="stat-chip-value">${avgCons}%</div><div class="stat-chip-label">Avg Consistency</div></div>
      <div class="stat-chip"><div class="stat-chip-value">+${totalXp.toLocaleString()}</div><div class="stat-chip-label">Total XP</div></div>
      <div class="stat-chip"><div class="stat-chip-value">${totalMins}</div><div class="stat-chip-label">Mins Typed</div></div>
    `;
  }

  function renderSessions(list) {
    const container = document.getElementById('sessions-list');
    container.innerHTML = '';

    if (!list.length) {
      container.innerHTML = `
        <div class="state-box">
          <div class="state-icon" style="display:flex; justify-content:center; margin-bottom:16px;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-3);"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </div>
          <div class="state-title">${currentMode === 'all' ? "No sessions yet" : `No "${currentMode}" sessions`}</div>
          <div class="state-msg">
            ${currentMode === 'all'
              ? 'Complete your first typing session to see your stats here.'
              : 'Try this mode to see data here.'}
          </div>
          <a href="typing.html" class="btn btn-primary btn-lg">Start Typing</a>
        </div>`;
      return;
    }

    list.forEach((sess, idx) => {
      const d = new Date(sess.created_at || sess.timestamp);
      const dateStr  = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      const timeStr  = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
      const mode     = sess.mode || 'classic';
      const wpm      = sess.wpm || 0;
      const acc      = typeof sess.accuracy === 'number' ? sess.accuracy : parseFloat(sess.accuracy || 0);
      const cons     = typeof sess.consistency === 'number' ? Math.round(sess.consistency) : Math.round(parseFloat(sess.consistency || 0));
      const xpEarned = sess.xp_earned || 0;
      const dur      = sess.duration_secs || 0;

      const accClass = acc >= 99 ? 'acc-perfect' : acc >= 95 ? 'acc-great' : acc >= 90 ? 'acc-ok' : 'acc-poor';
      const modeClass = `mode-${['classic','dev','zen','challenge','student','focus'].includes(mode) ? mode : 'default'}`;

      const card = document.createElement('div');
      card.className = 'session-card';
      card.style.opacity = '0';
      card.style.transform = 'translateY(8px)';
      card.innerHTML = `
        <div class="sess-date"><strong>${dateStr}</strong>${timeStr}</div>
        <div class="sess-mode"><span class="mode-pill ${modeClass}">${mode}</span></div>
        <div class="sess-wpm"><div class="val">${wpm}</div><div class="lbl">WPM</div></div>
        <div class="sess-acc"><div class="val ${accClass}">${acc.toFixed(1)}%</div><div class="lbl">Accuracy</div></div>
        <div class="sess-cons"><div class="val">${cons}%</div><div class="lbl">Consistency</div></div>
        <div class="sess-xp"><div class="xp-val">+${xpEarned} XP</div><div class="dur">${dur}s</div></div>
        <svg class="sess-spark" viewBox="0 0 120 36" preserveAspectRatio="none"></svg>
      `;
      container.appendChild(card);

      // Animate in
      requestAnimationFrame(() => {
        card.style.transition = `opacity 0.35s ease ${idx * 0.04}s, transform 0.35s ease ${idx * 0.04}s`;
        card.style.opacity = '1';
        card.style.transform = 'translateY(0)';
      });

      // Mini sparkline — use local WPM snapshot if available
      const rawWpm = sess.raw_wpm || wpm;
      drawSparkline(card.querySelector('.sess-spark'), wpm, rawWpm, acc);
    });
  }

  function drawSparkline(svg, wpm, rawWpm, acc) {
    // Synthesize 8 pseudo points based on wpm/acc for visual richness
    const pts = [];
    const variance = wpm * 0.12;
    for (let i = 0; i < 8; i++) {
      const t = i / 7;
      // Ramp up slightly toward end to show improvement feel
      const noise = (Math.random() - 0.5) * variance;
      pts.push(Math.max(1, wpm * (0.85 + t * 0.15) + noise));
    }
    const max = Math.max(...pts);
    const min = Math.min(...pts);
    const range = max - min || 1;
    const W = 120, H = 36, pad = 4;
    const coords = pts.map((v, i) => {
      const x = pad + (i / (pts.length - 1)) * (W - pad * 2);
      const y = H - pad - ((v - min) / range) * (H - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });

    const color = acc >= 97 ? '#10b981' : acc >= 93 ? '#f59e0b' : '#6366f1';
    const polyline = document.createElementNS('http://www.w3.org/2000/svg','polyline');
    polyline.setAttribute('points', coords.join(' '));
    polyline.setAttribute('fill', 'none');
    polyline.setAttribute('stroke', color);
    polyline.setAttribute('stroke-width', '2');
    polyline.setAttribute('stroke-linecap', 'round');
    polyline.setAttribute('stroke-linejoin', 'round');
    polyline.setAttribute('opacity', '0.8');
    svg.appendChild(polyline);

    // Dot at end
    const last = coords[coords.length - 1].split(',');
    const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx', last[0]);
    dot.setAttribute('cy', last[1]);
    dot.setAttribute('r', '3');
    dot.setAttribute('fill', color);
    svg.appendChild(dot);
  }

  init()
    .then(() => initScrollReveal(document.getElementById('sessions-list')))
    .catch(err => {
      console.error("TF Init: Critical error during history init:", err);
      const errMsg = err?.message || '';
      const isNetworkError = errMsg.includes('Network Error') || errMsg.includes('timeout') || errMsg.includes('HTTP 5') || errMsg.includes('Failed to fetch') || errMsg.includes('Database') || errMsg.includes('503') || errMsg.includes('500') || errMsg.includes('Internal Server Error');
      if (!isNetworkError && typeof Auth !== 'undefined' && Auth.triggerEmergencyLogout) {
        Auth.triggerEmergencyLogout("Critical app initialization crash.");
      } else {
        console.warn("TF: History page initialized in offline mode due to connection issue.");
      }
    });
</script>
</body>
